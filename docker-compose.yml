services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stitchops
      POSTGRES_USER: stitchops
      POSTGRES_PASSWORD: stitchops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stitchops -d stitchops"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./stitchops-backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://stitchops:stitchops@db:5432/stitchops?sslmode=disable
      DIRECT_DATABASE_URL: postgresql://stitchops:stitchops@db:5432/stitchops?sslmode=disable
      JWT_SECRET: change-me-to-a-long-random-string
      CLIENT_ORIGIN: ${CLIENT_ORIGIN}
      COOKIE_SECURE: "true"
      EXCHANGE_RATE_API_KEY: "08f68d0db829fc75606bc491"
    expose:
      - "4000"

  frontend:
    build:
      context: ./stitchops-react
      dockerfile: Dockerfile
      args:
        VITE_API_TARGET: http://backend:4000
    depends_on:
      - backend
    expose:
      - "80"

  adminer:
    image: adminer
    depends_on:
      - db
    expose:
      - "8080"

volumes:
  postgres_data:
