services:
  db:
    image: postgres:16-alpine
    container_name: stitchops-db
    environment:
      POSTGRES_DB: stitchops
      POSTGRES_USER: stitchops
      POSTGRES_PASSWORD: stitchops
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stitchops -d stitchops"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./stitchops-backend
      dockerfile: Dockerfile
    container_name: stitchops-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://stitchops:stitchops@db:5432/stitchops?sslmode=disable
      DIRECT_DATABASE_URL: postgresql://stitchops:stitchops@db:5432/stitchops?sslmode=disable
      JWT_SECRET: change-me-to-a-long-random-string
      CLIENT_ORIGIN: http://localhost:8080
      COOKIE_SECURE: "false"
    ports:
      - "4000:4000"

  frontend:
    build:
      context: ./stitchops-react
      dockerfile: Dockerfile
      args:
        VITE_API_TARGET: http://backend:4000
    container_name: stitchops-frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  postgres_data:
