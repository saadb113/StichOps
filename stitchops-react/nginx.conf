server {
  listen 80;
  server_name _;

  # Docker's internal DNS. Resolving the backend per request (via the
  # variable below) means nginx still starts while the backend is down or
  # restarting, and follows it when it comes back with a new IP — a fixed
  # upstream is resolved once at startup and either fails hard or goes stale.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:4000;

  # Logos and Excel/CSV imports can be several MB (nginx defaults to 1 MB).
  client_max_body_size 20m;

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  location /api/notifications/stream {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    chunked_transfer_encoding off;
  }

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Large imports/exports can take a while.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /uploads/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
